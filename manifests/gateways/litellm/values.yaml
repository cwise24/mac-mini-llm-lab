# LiteLLM: the pragmatist's AI gateway.
#
# Chosen when GATEWAY=litellm. Strength is breadth -- one config block maps a
# model alias to essentially any provider, local or hosted, with fallbacks and
# per-key budgets. Weakness for this lab: it does its own routing, so an
# InferencePool/EPP in front of it is redundant and the llm-d scheduling signal
# is lost. Use it when you care about provider abstraction, not scheduling.
#
# Chart lives at helm/litellm-helm in the BerriAI/litellm repo. There is no
# public classic repo and no OCI package, so it is installed from git source.
replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm
  tag: main-stable
  pullPolicy: IfNotPresent

resources:
  requests: { cpu: 100m, memory: 256Mi }
  # 768Mi is not enough. LiteLLM imports a very large provider surface at boot
  # and gets OOMKilled (exit 137) ~10s in, BEFORE it writes a single log line --
  # so the only visible symptom is a startup probe failing on connection refused
  # with empty `kubectl logs`, which reads like a config error rather than RAM.
  # This is a limit, not a reservation, so it costs nothing until used.
  limits:   { memory: 2Gi }

service:
  type: ClusterIP
  # Chart default is 4000. Normalised to 8080 because every gateway overlay must
  # answer on the same port for the NGF HTTPRoute to be gateway-agnostic.
  port: 8080

# PostgreSQL: required for the admin UI, and NOT VALIDATED on this hardware.
#
# STATUS: LITELLM_WITH_DB defaults to false because the true path has never
# completed successfully here. One attempt on a 9.7Gi node with PROFILE=full took
# the API server down mid-install. Whether that is node memory exhaustion or the
# migration job failing against Postgres is still unknown. Treat the true path as
# an experiment, not a supported configuration, until someone runs it green.
#
# This was originally disabled to save ~300 MB, on the reasoning that a lab does
# not need key management or spend tracking. That reasoning was wrong about what
# the DB is load-bearing for: LiteLLM's /ui authenticates against Postgres, so
# without it every login fails with "Authentication Error, Not connected to DB!"
# while the OpenAI API keeps working perfectly. The result is a gateway that
# passes every smoke test and has an unusable dashboard.
#
# Set LITELLM_WITH_DB=false in .env to trade the UI back for the memory.
db:
  useExisting: false
  deployStandalone: __LITELLM_WITH_DB__

# Chart.yaml gates the postgresql subchart on `db.deployStandalone`, not on
# `postgresql.enabled` -- setting the latter alone does nothing.
postgresql:
  enabled: __LITELLM_WITH_DB__
  primary:
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits:   { memory: 512Mi }
    persistence:
      size: 2Gi

redis:
  enabled: false

# Creates the schema. Without it the pod starts, connects, and then fails every
# query against tables that do not exist.
migrationJob:
  enabled: __LITELLM_WITH_DB__

masterkey: sk-llm-lab-local

proxy_config:
  model_list:
    - model_name: __VLLM_SERVED_NAME__
      litellm_params:
        model: hosted_vllm/__VLLM_SERVED_NAME__
        api_base: http://vllm-cpu.llm-serving.svc.cluster.local:8000/v1
        api_key: none
    - model_name: __HOST_ENGINE_MODEL__
      litellm_params:
        model: openai/__HOST_ENGINE_MODEL__
        api_base: http://host-bridge.llm-serving.svc.cluster.local:8000/v1
        api_key: none
    # Demonstrates fallback: try the slow local model, fall back to Metal
    - model_name: auto
      litellm_params:
        model: hosted_vllm/__VLLM_SERVED_NAME__
        api_base: http://vllm-cpu.llm-serving.svc.cluster.local:8000/v1
        api_key: none

  litellm_settings:
    drop_params: true
    request_timeout: 600
    fallbacks: [{ "auto": ["__HOST_ENGINE_MODEL__"] }]

  general_settings:
    master_key: sk-llm-lab-local
